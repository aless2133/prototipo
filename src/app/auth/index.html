<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoftBiblio · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/globals.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow auth-card__eyebrow">SoftBiblio</p>
      <h1 class="auth-card__title">Bienvenido de nuevo</h1>
      <p class="auth-card__subtitle">Ingresa con tu cuenta institucional para consultar el catálogo y tus préstamos.</p>

      <div class="auth-alert" id="authAlert" role="alert"></div>

      <form id="authForm" novalidate>
        <div class="field" id="emailField" style="margin-bottom: var(--space-4);">
          <label class="field-label" for="email">Correo institucional</label>
          <div class="field-wrap">
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
            </span>
            <input class="input has-icon-left" type="email" id="email" name="email" placeholder="usuario@correo.com" autocomplete="username">
          </div>
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field" id="passwordField" style="margin-bottom: var(--space-5);">
          <label class="field-label" for="password">Contraseña</label>
          <div class="field-wrap">
            <input class="input has-icon-right" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
            <button class="field-action" type="button" id="togglePassword" aria-label="Mostrar contraseña">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submitBtn">
          <span class="btn-spinner" id="submitSpinner" style="display: none;" aria-hidden="true"></span>
          <span id="submitLabel">Iniciar sesión</span>
        </button>
      </form>

      <p class="auth-foot">Acceso exclusivo para usuarios registrados de la biblioteca del instituto.</p>
    </section>
  </main>

  <script type="module" src="../../features/auth/controllers/useAuth.js"></script>
</body>
</html>
